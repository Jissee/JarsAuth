label.profile.name=Group Name
label.profile.name.tip=<html>Groups are divided into "Client Groups" and "Custom Groups". Client groups record complete client file information for checksum<br/>Client groups must be added via server record mode. Custom groups do not contain client information and are only used for rule grouping and management<br/><br/>Rename item: Double-click / Enter<br/>Delete item: Delete / Backspace<br/>Create item: Insert<br/>Press Space on a client group to view all registered files</html>
label.profile.rule=Rules
label.profile.rule.rip=<html>Rules specify files to be verified or excluded, relative to the client's .minecraft directory<br/><br/>No prefix indicates an "include" rule<br/>! prefix indicates an exclude rule and must be placed at the beginning of the string<br/>& prefix indicates inheriting all rules from another group<br/><br/>Wildcards can be used in file paths<br/>? represents exactly one arbitrary character<br/>* represents zero or more arbitrary characters<br/>: prefix indicates the entire rule is a regular expression<br/><br/>During editing, the original rule list is shown; after editing, the box displays all expanded rules for this group<br/><br/>Edit: Enter / Double-click</html>

