label.server.license.time.clear=Clear Time
label.server.license.time.reset.tip=<html>The specific time to perform allowance reset, range: [00:00:00~23:59:59]<br/>The reset is executed when the system time reaches the configured time<br/>If reset time and clear time are the same, clearing is calculated first, then reset<br/>For the "Single-use" type, reset is executed only at the "Reset Time" on the "Valid From" date, and clearing is executed only at the "Clear Time" on the "Valid Until" date</html>
label.server.license.time.clear.tip=<html>The specific time to perform allowance clearing, range: [00:00:00~23:59:59]<br/>The clearing is executed when the system time reaches the configured time<br/>If reset time and clear time are the same, clearing is calculated first, then reset<br/>For the "Single-use" type, reset is executed only at the "Reset Time" on the "Valid From" date, and clearing is executed only at the "Clear Time" on the "Valid Until" date</html>

label.server.license.group=User Group
label.server.license.group.tip=<html>A default group is mandatory and applies to all users; usernames cannot be added to it<br/>If a user belongs to multiple groups, the group with the highest allowance takes precedence<br/>Allowances are updated per group; all groups' allowances decrease, and the user may connect as long as any group's license instance has remaining allowance</html>
label.server.license.license=License Template
label.server.license.license.tip=<html>Double-click to edit an existing item<br/>Insert to add a new item</html>
label.server.license.rule=Rules
label.server.license.rule.tip=<html>Rules can include usernames, license templates (identifiers), and inheritance from other user groups<br/>The same license template cannot be added twice in one group; to stack, adjust the template allowance or use inheritance<br/>When inheriting, all rules of the inherited group are obtained, and allowances of identical templates are stacked (e.g., two inherited identical templates equal template allowance ×2)<br/><br/>No prefix indicates a username<br/>: prefix indicates a license identifier<br/>& prefix indicates inheriting another user group (only rules are inherited, not users)<br/>At runtime, each user group checks all usernames and license templates in the group to generate instances<br/><br/>Double-click to edit</html>
label.server.license.instance=Instance
label.server.license.instance.tip=<html>Instances are generated from license templates to calculate remaining user allowance and determine whether a user can connect<br/>Allowances are updated periodically and connection eligibility is checked; manual modification is supported</html>

