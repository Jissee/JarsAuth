tab.file.checksum=文件校验EN
tab.file.checksum.tip=<html>此功能用于客户端文件校验<br/>组名为所有已经注册的客户端信息，一个完整的客户端信息为一组<br/>客户端组需要通过服务器记录模式添加，可建立自定义组用于规则管理<br/>规则为需要校验的文件路径，使用 “&组名”引用其它组的所有规则<br/><br/>重命名项目：双击/Enter <br/>删除项目：Delete/Backspace<br/>创建项目：Insert<br/>编辑组内所有规则：Shift + Insert/Enter/双击</html>
tab.client.auth=客户端验证
tab.client.auth.tip=<html>此功能用于防止玩家被顶替，仅推荐离线模式下使用，在线服务器无需开启<br/>服务端ID将在服务器运行时自动生成，不要随意重置，否则可能会导致客户端无法连接<br/>客户端ID将在客户端连接时自动添加，如果客户端遗失ID而无法连接，删除对应的客户端ID即可连接<br/><br/>删除项目：Delete/Backspace</html>
