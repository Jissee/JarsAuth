label.profile.name=组名
label.profile.name.tip=<html>组分为“客户端组”和“自定义组”，客户端组记录了一个完整的客户端文件信息，以便校验<br/>客户端组需要通过服务器记录模式添加，自定义组不包含客户端信息，仅用于规则分组管理，可自由添加<br/><br/>重命名项目：双击/Enter <br/>删除项目：Delete/Backspace<br/>创建项目：Insert<br/>客户端组按空格可查看所有已经注册的文件</html>
