label.server.license.time.clear.tip=<html>具体执行限额清除的时间，范围：[00:00:00~23:59:59]<br/>在系统时间变为设定时间时执行清除操作<br/>如果重置和清除时间相同，则先计算清除，再计算重置<br/>类型为“单次有效”时，仅在“有效期起”当天的“重置时间”执行重置，仅在“有效期至”当天的“清除时间”执行清除</html>


